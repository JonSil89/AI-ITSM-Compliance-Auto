name: Compliance & Policy Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Policy Validation
        run: |
          echo "Starting Policy-as-Code Validation..."

          required_files=(
            README.md
            .env.example
            orchestrate.sh
            docs/controls/ISO27001_CONTROL_MAPPING.md
            docs/evidence/AUDIT_EVIDENCE_TEMPLATE.md
            docs/evidence/VALIDATION_REPORT_EXAMPLE.md
            docs/policies/POLICY_AS_CODE_MODEL.md
            docs/architecture/SYSTEM_BOUNDARIES.md
            docs/architecture/AI_BOUNDARY_MODEL.md
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "FAILED: missing required file: $file"
              exit 1
            fi
          done

          README_SIZE=$(wc -c < README.md)
          if [ "$README_SIZE" -lt 1000 ]; then
            echo "FAILED: README.md is too short for the documentation baseline."
            exit 1
          fi

          echo "SUCCESS: All policy checks passed."
